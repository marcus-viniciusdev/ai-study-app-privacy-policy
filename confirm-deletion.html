<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Deletion Scheduled — AI Study App</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f9f9fb; padding: 20px; color: #333; }
        .card { max-width: 500px; margin: 40px auto; background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); text-align: center; }
        h1 { color: #dc2626; font-size: 1.5em; margin-top: 0; }
        p { color: #555; font-size: 0.95em; line-height: 1.5; }
        .success-box { background: #ecfdf5; color: #065f46; border: 1px solid #a7f3d0; padding: 15px; border-radius: 8px; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Account Deletion Confirmed</h1>
        <div class="success-box">
            <p>Your request has been successfully recorded.</p>
            <p>Your account and all associated data will be permanently deleted in <strong>7 days</strong>.</p>
        </div>
        <p style="margin-top: 20px; font-size: 0.85em; color: #777;">
            If you change your mind, simply log in back to the AI Study App within 7 days to automatically cancel this request.
        </p>
    </div>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
      import { getAuth, isSignInWithEmailLink, signInWithEmailLink } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
      import { getFirestore, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "AIzaSyD-n0-VWPJXv2TwjztHuzelHBMk93uGchE",
        authDomain: "ai-study-app-abec8.firebaseapp.com",
        projectId: "ai-study-app-abec8",
        storageBucket: "ai-study-app-abec8.firebasestorage.app",
        messagingSenderId: "521923125430",
        appId: "1:521923125430:web:e7936b87645a2300c7c617"
      };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const db = getFirestore(app);

      if (isSignInWithEmailLink(auth, window.location.href)) {
        let email = window.localStorage.getItem('emailForSignIn');
        if (!email) {
          email = window.prompt('Please confirm your email address:');
        }

        signInWithEmailLink(auth, email, window.location.href)
          .then(async (result) => {
            const user = result.user;
            const deletionDate = new Date();
            deletionDate.setDate(deletionDate.getDate() + 7);

            // Grava a solicitação no Firestore com status pending
            await setDoc(doc(db, "deletion_requests", user.uid), {
              uid: user.uid,
              email: user.email,
              requestedAt: serverTimestamp(),
              scheduledFor: deletionDate,
              status: "pending"
            });
          })
          .catch((error) => {
            console.error("Error confirming deletion:", error);
          });
      }
    </script>
</body>
</html>
